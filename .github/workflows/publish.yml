# On every push to main: publish the merged submissions (as the pull request's author),
# remove them, commit the updated public/, and deploy public/ to GitHub Pages.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install vard
        run: |
          curl -fsSL https://github.com/vardemin/vardui/releases/latest/download/vard-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
          vard --version

      - name: Publish submissions
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_KEY: ${{ secrets.REGISTRY_KEY }}
        run: |
          shopt -s nullglob
          dirs=(submissions/*/)
          if [ ${#dirs[@]} -eq 0 ]; then echo "nothing to publish"; exit 0; fi
          mkdir -p private
          printf '%s' "$REGISTRY_KEY" > private/registry.key
          owner=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].user.login // empty' 2>/dev/null || true)
          owner=${owner:-$GITHUB_ACTOR}
          echo "owner: $owner"
          for dir in "${dirs[@]}"; do
            [ -f "$dir/vard.toml" ] || continue
            vard publish "$dir" --registry . --owner "$owner"
            git rm -rq "$dir"
          done
          rm -rf private
          vard registry verify .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public submissions
          git commit -q -m "Publish packages from $GITHUB_SHA"
          git push -q

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
